name: quality

# The suite, run on itself. A linter whose own repository does not pass it is a
# linter nobody has read.
#
# Actions are pinned to a commit, with the tag beside it: a tag can be moved, a commit
# cannot, and a tool that reports unpinned installs does not get to run on one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    name: golden corpus
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: every rule, positive and negative
        run: python tests/run_tests.py
      - name: no rule left unobserved
        run: python tests/run_tests.py --coverage
      - name: the generated pages match the code
        run: python tools/build_docs.py --check

  self-check:
    name: the suite on itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./
        with:
          path: skills/skill-quality-suite
          command: all
          harness: all
          upload-sarif: "true"
